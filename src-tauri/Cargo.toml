[package]
name = "deeptutor-shell"
version = "1.0.0"
description = "DeepTutor 桌面壳"
authors = ["YZH2653"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# 桌面版只需 rlib；cdylib/staticlib 供移动端使用
# GNU 工具链下 cdylib 触发 MinGW「export ordinal too large」链接错误，故去掉
name = "deeptutor_shell_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
url = "2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
